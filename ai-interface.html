<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 测试提示词 · 算力余烬</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;color:#dfe8f4;background:#0d1522}*{box-sizing:border-box}
body{margin:0;padding:32px 20px}main{max-width:920px;margin:auto}h1{font-size:clamp(28px,5vw,40px);margin:0 0 12px}
a{color:#9ad0fc}button{cursor:pointer;background:#16344e;border:1px solid #477697;color:#e4f3ff;border-radius:7px;padding:10px 16px;font:inherit}
textarea{width:100%;min-height:32rem;resize:vertical;border:1px solid #334357;border-radius:8px;background:#111d2c;color:inherit;font:inherit;padding:16px}
#status{color:#f3cc8b;margin-left:10px}
</style></head>
<body><main>
<h1>AI 测试提示词</h1>
<p><a href="./">返回《算力余烬》</a></p>
<p>把下方提示词交给能操作浏览器、能在当前网页执行 JavaScript 的 AI。只有聊天功能的 AI 也能给出建议，你需要把观测发给它，并在 F12 控制台代为执行它给出的指令。</p>
<p><button type="button" id="copy">复制测试提示词</button><span id="status" role="status"></span></p>
<textarea id="prompt" aria-label="测试提示词" readonly>请在《算力余烬》网页版测试 AI 对局接口：
https://suanli-yujin.pages.dev/

1. 打开游戏，点「开始游戏」→「管理员观战（AI 调试）」→ 锁定运维小队 → 选择稽核员并开局。记录地图、四名运维员、稽核员和自选技能；做多局时轮换地图。保持游戏标签页运行。
2. 在游戏标签页执行 window.EmberAI.getObservation()。status 为 active 才能下指令。idle 表示还没开局或已经结束，unavailable 表示当前不是管理员观战。
3. 每次决策先重新读观测。运维任务从该角色的 options 中选一项，把该角色的 id 和选项的 choice 原样提交。例如：
const obs = window.EmberAI.getObservation();
const unit = obs.squad?.find(a => a.options.length > 0);
if (unit) window.EmberAI.sendCommand({
  actor: unit.id, action: "task", choice: unit.options[0].choice
});
上面用第一项演示格式，实际测试请根据状态重新选择：空手时取卡，持卡时找可安装节点，已有装卡节点时评估修复，队友需要救援时评估救援；以当前 options 为准。
4. 运维员主动技能用 {actor: 运维员id, action: "skill"}。稽核员普攻用 {actor: "hunter", action: "attack"}，角色专属主动技能用 {actor: "hunter", action: "skill"}。普攻沿当前朝向，技能遵守冷却；接口未提供自由移动、瞄准或释放自选技能的指令。不要用内部引擎对象改状态或快进。
5. ok:true 的任务指令只表示已分派。等画面推进，再读观测检查位置、节点、状态是否变化。ok:false 时记录 error，先刷新观测再决定下一步，避免反复重试同一条。
6. 每局记录实际用了哪些指令、哪些成功及对应效果、结束原因、撤离人数、胜负和游戏内用时。有控制台错误时记录原文。只测试了单次指令时，请标明覆盖范围；读不到结算时请写「未观察到结算」。</textarea>
</main><script>
const prompt=document.getElementById('prompt');
const status=document.getElementById('status');
document.getElementById('copy').addEventListener('click',async()=>{
  try {
    await navigator.clipboard.writeText(prompt.value);
    status.textContent='已复制';
  } catch {
    prompt.focus();
    prompt.select();
    status.textContent='已选中，请按 Ctrl+C 复制';
  }
});
</script></body></html>
