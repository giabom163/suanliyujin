<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 测试提示词 · 算力余烬</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;color:#dfe8f4;background:#0d1522}*{box-sizing:border-box}
body{margin:0;padding:32px 20px}main{max-width:920px;margin:auto}h1{font-size:clamp(28px,5vw,40px);margin:0 0 12px}
a{color:#9ad0fc}button{cursor:pointer;background:#16344e;border:1px solid #477697;color:#e4f3ff;border-radius:7px;padding:10px 16px;font:inherit}
textarea{width:100%;min-height:32rem;resize:vertical;border:1px solid #334357;border-radius:8px;background:#111d2c;color:inherit;font:inherit;padding:16px}
#status{color:#f3cc8b;margin-left:10px}
</style></head>
<body><main>
<h1>AI 测试提示词</h1>
<p><a href="./">返回《算力余烬》</a></p>
<p>把下方提示词交给能操作浏览器、能在当前网页执行 JavaScript 的 AI。只有聊天功能的 AI 也能给出建议，你需要把观测发给它，并在 F12 控制台代为执行它给出的指令。</p>
<p><button type="button" id="copy">复制测试提示词</button><span id="status" role="status"></span></p>
<textarea id="prompt" aria-label="测试提示词" readonly>在《算力余烬》网页版验证 EmberAI 对局接口。正式入口
https://giabom.online/

1. 按真实流程开一局。「开始游戏」→「管理员观战 (AI调试)」→「锁定小队 · 进入稽核选人」→「确认稽核员并部署」。记下地图、四名运维员、稽核员和选定技能。多局时换图，保持游戏页运行。

2. 每次下令前，在游戏页读取 window.EmberAI.getObservation()。只有 status 为 active 才下令。结合角色状态和当前 options 选择任务。空手时可选取卡，持卡时可选装卡，有装卡节点时可修复，队友被关时可救援。把该角色的 id 和选项的 choice 原样发给 window.EmberAI.sendCommand({actor: unit.id, action: "task", choice: option.choice})。没有可用选项就等画面推进再读。

3. 运维主动技能用 {actor: unit.id, action: "skill"}，稽核普攻和专属主动分别用 {actor: "hunter", action: "attack"} 和 {actor: "hunter", action: "skill"}。等待合适的距离、朝向和冷却。只用公开接口，按正常对局速度观察。

4. 分开记录指令回执和实际效果。ok:true 的任务回执表示已分派，推进后重读观测或观察画面来验证。ok:false 时记录原始 error、刷新观测后再决定。记录实际测到的动作、效果和页面错误。若看见结算，再记录胜负、撤离人数、结束原因和游戏内用时。没看见就写「未观察到结算」，并注明覆盖范围。</textarea>
</main><script>
const prompt=document.getElementById('prompt');
const status=document.getElementById('status');
document.getElementById('copy').addEventListener('click',async()=>{
  try {
    await navigator.clipboard.writeText(prompt.value);
    status.textContent='已复制';
  } catch {
    prompt.focus();
    prompt.select();
    status.textContent='已选中，请按 Ctrl+C 复制';
  }
});
</script></body></html>
